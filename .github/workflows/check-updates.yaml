name: Check for updates

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install ruamel.yaml
        run: pip install --user ruamel.yaml

      - name: Check jellyfin and jellyfin-ffmpeg for newer portable builds
        id: check
        run: |
          python3 << 'PYEOF'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from ruamel.yaml import YAML

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 4096
          yaml_path = "snap/snapcraft.yaml"
          with open(yaml_path) as f:
              data = yaml.load(f)

          def fetch(url):
              with urllib.request.urlopen(url) as r:
                  return r.read().decode()

          def sha256_of(url):
              h = hashlib.sha256()
              with urllib.request.urlopen(url) as r:
                  while True:
                      chunk = r.read(1 << 20)
                      if not chunk:
                          break
                      h.update(chunk)
              return h.hexdigest()

          updates = []

          # --- jellyfin server: repo.jellyfin.org publishes one directory per
          # version (v10.11.11/), so find the highest version directory and
          # compare it to the version pinned in the part's source URL.
          part = data["parts"]["jellyfin"]
          index = fetch("https://repo.jellyfin.org/files/server/linux/stable/")
          versions = re.findall(r'href="v([\d.]+)/"', index)
          latest = max(versions, key=lambda v: tuple(int(p) for p in v.split(".")))
          current_match = re.search(r"/v([\d.]+)/amd64/", part["source"])
          current = current_match.group(1) if current_match else None
          if latest != current:
              url = (
                  f"https://repo.jellyfin.org/files/server/linux/stable/"
                  f"v{latest}/amd64/jellyfin_{latest}-amd64.tar.xz"
              )
              part["source"] = url
              part["source-checksum"] = f"sha256/{sha256_of(url)}"
              part["override-build"] = f'craftctl default\ncraftctl set version="{latest}"\n'
              updates.append({
                  "part": "jellyfin",
                  "current": current,
                  "latest": latest,
                  "note": f"https://github.com/jellyfin/jellyfin/releases/tag/v{latest}",
              })

          # --- jellyfin-ffmpeg: the "latest-7.x" path always points at the
          # newest 7.x build; the actual version is embedded in the filename,
          # so re-list the directory and compare filenames.
          part = data["parts"]["jellyfin-ffmpeg"]
          index = fetch("https://repo.jellyfin.org/files/ffmpeg/linux/latest-7.x/amd64/")
          fname_match = re.search(r'href="(jellyfin-ffmpeg_[^"]+\.tar\.xz)"', index)
          fname = fname_match.group(1)
          current_fname = part["source"].rsplit("/", 1)[-1]
          if fname != current_fname:
              url = f"https://repo.jellyfin.org/files/ffmpeg/linux/latest-7.x/amd64/{fname}"
              part["source"] = url
              part["source-checksum"] = f"sha256/{sha256_of(url)}"
              updates.append({
                  "part": "jellyfin-ffmpeg",
                  "current": current_fname,
                  "latest": fname,
                  "note": url,
              })

          with open(yaml_path, "w") as f:
              yaml.dump(data, f)

          with open("/tmp/updates.json", "w") as f:
              json.dump(updates, f)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"update_needed={'true' if updates else 'false'}\n")

          for u in updates:
              print(u)
          PYEOF

      - name: Build PR metadata
        if: steps.check.outputs.update_needed == 'true'
        id: pr_meta
        run: |
          python3 << 'PYEOF'
          import json
          import os

          updates = json.load(open("/tmp/updates.json"))
          title = "Update " + ", ".join(u["part"] for u in updates)
          body_lines = [
              "Automated update to track the latest upstream portable builds.",
              "",
              "**Changes:**",
          ]
          for u in updates:
              body_lines.append(f"- **{u['part']}**: `{u['current']}` → `{u['latest']}` ({u['note']})")
          body = "\n".join(body_lines)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"title={title}\n")
              f.write(f"body<<PREOF\n{body}\nPREOF\n")
          PYEOF

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.pr_meta.outputs.title }}"
          title: "${{ steps.pr_meta.outputs.title }}"
          body: "${{ steps.pr_meta.outputs.body }}"
          branch: update-parts
          delete-branch: true
